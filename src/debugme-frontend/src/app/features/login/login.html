<div class="login-page">
  <!-- Background decoration -->
  <div class="bg-decoration">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="login-card">
    <div class="card-brand">
      <div class="brand-icon">🪷</div>
      <h1>DebugMe</h1>
      <p class="subtitle">Seu espaço para registrar e compreender suas emoções</p>
    </div>

    <div class="error-message" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">E-mail</label>
        <div class="input-wrapper">
          <span class="input-icon">✉️</span>
          <input
            id="email"
            type="email"
            formControlName="email"
            placeholder="seuemail@exemplo.com"
            [class.input-error]="submitted && email?.invalid"
          />
        </div>
        <small class="error" *ngIf="submitted && email?.errors?.['required']">
          O e-mail é obrigatório.
        </small>
        <small class="error" *ngIf="submitted && email?.errors?.['email']">
          Informe um e-mail válido.
        </small>
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input
            id="password"
            type="password"
            formControlName="password"
            placeholder="Digite sua senha"
            [class.input-error]="submitted && password?.invalid"
          />
        </div>
        <small class="error" *ngIf="submitted && password?.errors?.['required']">
          A senha é obrigatória.
        </small>
        <small class="error" *ngIf="submitted && password?.errors?.['minlength']">
          A senha deve ter pelo menos 6 caracteres.
        </small>
      </div>

      <button type="submit" [disabled]="loading" class="btn-submit">
        <span *ngIf="loading" class="spinner"></span>
        <span *ngIf="!loading">✦ Entrar</span>
        <span *ngIf="loading">Entrando...</span>
      </button>
    </form>

    <p class="register-link">
      Não tem conta?
      <a routerLink="/register">Cadastre-se</a>
    </p>

    <p class="footer-text">Acolhimento, clareza e autoconsciência em um só lugar</p>
  </div>
</div>
